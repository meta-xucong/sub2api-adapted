global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    option redispatch
    option clitcpka
    option srvtcpka
    timeout connect 3s
    timeout check 2s
    timeout client 300s
    timeout server 300s
    retries 2

frontend socks5_failover_front
    bind 127.0.0.1:21080
    bind 172.18.0.1:21080
    default_backend socks5_failover_back

backend socks5_failover_back
    option tcp-check
    default-server inter 2s fastinter 1s downinter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server jp1 127.0.0.1:20081 check
    server jp2 127.0.0.1:20082 check backup
    server jp3 127.0.0.1:20083 check backup

